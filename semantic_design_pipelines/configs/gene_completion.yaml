# Gene-completion evaluation (proto-language)
#
#   Evo 1.5 (prompt prepended) -> Prodigal + prompt-spanning ORF filter + QC
#   -> MAFFT identity against the reference protein
#
# This is an evaluation, not a design run, and it never used ESMFold, so no
# structure prediction happens here.
#
# Outputs (all in output_dir):
#   generated_sequences.csv, filter_summary.csv, proteins.fasta,
#   identity_results.csv, summary_statistics.csv

input_prompts: ./semantic_design_pipelines/data/prompts/gene_completion_prompts.csv
reference_seqs: ./semantic_design_pipelines/data/reference/rpos_sequences.fasta
output_dir: gene_completion
# Where output_dir is created. Precedence: --output-root > the
# PROTO_PIPELINES_OUTPUT_ROOT env var > this key > <repo>/outputs.
# output_root: /path/to/results

# Generator family and checkpoint. 'evo2' is the default; the paper used
# Evo 1.5, so reproducing its numbers needs BOTH lines switched to:
#   generator: evo1
#   model_name: evo-1.5-8k-base
generator: evo2
model_name: evo2_7b        # evo2_7b | evo2_40b | evo2_7b_base | evo2_1b_base | ...

# Sample from a CUSTOM Evo 2 checkpoint -- fine-tuned, continued-pretrained,
# or otherwise modified -- instead of the HuggingFace download. Point it at the weights DIRECTORY, not
# a checkpoint file. `model_name` above still selects the architecture the
# weights load into, so it must name the variant the checkpoint derives from.
# Evo 2 only -- Evo 1 has no such hook and setting both raises rather than
# silently sampling the stock model. Empty means "use the released weights".
model_local_path: ""
n_tokens: 1000
temperature: 0.7
top_k: 4
batch_size: 2
n_sample_per_prompt: 3
seed: null
device: cuda
verbose: false

filter_min_length: 50
filter_max_length: 1200
filter_partial_bool: false
segmasker_threshold: 0.1

# --- identity analysis ------------------------------------------------------
run_identity_analysis: true
seq_identity_match_threshold: 30.0   # min best-match identity to score at all
protein_label_column: Protein_Label  # prompt CSV column naming the reference
mafft_threads: 1

# Read non_prompt_sequence_identity in identity_results.csv, not
# full_sequence_identity: the prompt region is copied from the input, so the
# full-length figure is inflated by however much of the gene was given.
