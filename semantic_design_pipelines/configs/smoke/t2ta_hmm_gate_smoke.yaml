# Smoke variant with the profile-HMM gate ARMED (hmm_annotate_only: false).
# The other smoke configs run the filter in annotate-only mode so downstream
# stages always get exercised, which means their filter_summary always shows
# profile_hmm rejected=0 -- the rejection path is never actually tested.
# This config is the one that tests it. More samples, because with the gate
# armed most generations are expected to be dropped here.
# End-to-end smoke test of the consolidated single-script t2ta pipeline:
#   Evo -> QC -> profile-HMM -> AF3 monomer -> pairing -> AF3 cofold
# 2 prompts x 3 samples. Reduced AF3 fidelity and permissive gates so the
# wiring is exercised deterministically; NOT settings for a real run.
input_prompts: ./semantic_design_pipelines/configs/smoke/t2ta_prompts_smoke.csv
output_dir: smoke/t2ta_hmm_gate

# Evo 1.5: the generator family must be named, or the evo2 default is
# paired with an Evo 1 checkpoint and the run fails at startup.
generator: evo1
model_name: evo-1.5-8k-base
n_tokens: 2000
temperature: 0.8
top_k: 4
batch_size: 2
n_sample_per_prompt: 6
seed: 0
device: cuda
verbose: true

filter_min_length: 50
filter_max_length: 300
filter_partial_bool: true
segmasker_threshold: 0.1

# HMM on, annotate-only so it records hits without gating this tiny run out
hmm_path: ./semantic_design_pipelines/data/models/ta_families.hmm
hmm_evalue_threshold: 1.0
hmm_required_profiles: []
hmm_min_matching_proteins: 1
hmm_annotate_only: false

run_af3: true
af3_plddt_threshold: 0.0
af3_ptm_threshold: 0.0
af3_max_proteins_per_proposal: 2
af3_use_msa: false
af3_num_recycles: 3
af3_num_diffusion_samples: 1
af3_seeds: [0]
af3_save_structures: true

max_pair_identity: 70.0
mafft_threads: 4

run_cofold: true
cofold_pdockq2_threshold: 0.0
cofold_min_iptm: 0.0
cofold_min_avg_plddt: 0.0
cofold_min_passing_pairs: 1
cofold_max_pairs_per_proposal: 1
cofold_af3_use_msa: true
cofold_af3_num_recycles: 3
cofold_af3_num_diffusion_samples: 1
cofold_af3_save_structures: true
novelty_max_identity: 75.0
