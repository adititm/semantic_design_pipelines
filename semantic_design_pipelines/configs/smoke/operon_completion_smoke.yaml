# Smoke test: 1 operon prompt x 2 samples. No structure prediction.
input_prompts: ./semantic_design_pipelines/configs/smoke/operon_completion_prompts_smoke.csv
reference_seqs: ./semantic_design_pipelines/data/reference/modabc_operon_sequences.fasta
output_dir: smoke/operon_completion

# Evo 1.5: the generator family must be named, or the evo2 default is
# paired with an Evo 1 checkpoint and the run fails at startup.
generator: evo1
model_name: evo-1.5-8k-base
n_tokens: 1500
temperature: 0.7
top_k: 4
batch_size: 2
n_sample_per_prompt: 2
seed: 0
device: cuda
verbose: true

filter_min_length: 50
filter_max_length: 1200
filter_partial_bool: false
segmasker_threshold: 0.1

run_identity_analysis: true
seq_identity_match_threshold: 30.0
expected_response_column: Expected_Response
mafft_threads: 4
