# End-to-end smoke test of the consolidated single-script t2ta pipeline:
#   Evo -> QC -> profile-HMM -> AF3 monomer -> pairing -> AF3 cofold
# 2 prompts x 3 samples. Reduced AF3 fidelity and permissive gates so the
# wiring is exercised deterministically; NOT settings for a real run.
input_prompts: ./proto_pipelines/configs/smoke/t2ta_prompts_smoke.csv
output_dir: smoke/t2ta_evo2_final

model_name: evo2_7b
n_tokens: 2000
temperature: 0.8
top_k: 4
batch_size: 2
n_sample_per_prompt: 3
seed: 0
device: cuda
verbose: true

filter_min_length: 50
filter_max_length: 300
filter_partial_bool: true
segmasker_threshold: 0.1

# HMM on, annotate-only so it records hits without gating this tiny run out
hmm_path: ./proto_pipelines/calibration/data/ta_families.hmm
hmm_evalue_threshold: 1.0
hmm_required_profiles: []
hmm_min_matching_proteins: 1
hmm_annotate_only: true

run_af3: true
af3_plddt_threshold: 0.0
af3_ptm_threshold: 0.0
af3_max_proteins_per_proposal: 2
af3_use_msa: false
af3_num_recycles: 3
af3_num_diffusion_samples: 1
af3_seeds: [0]
af3_save_structures: true

max_pair_identity: 70.0
mafft_threads: 4

run_cofold: true
cofold_pdockq2_threshold: 0.0
cofold_min_iptm: 0.0
cofold_min_avg_plddt: 0.0
cofold_min_passing_pairs: 1
cofold_max_pairs_per_proposal: 1
cofold_af3_use_msa: true
cofold_af3_num_recycles: 3
cofold_af3_num_diffusion_samples: 1
cofold_af3_save_structures: true
novelty_max_identity: 75.0

generator: evo2
