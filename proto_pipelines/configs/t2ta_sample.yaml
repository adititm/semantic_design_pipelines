# Type II toxin-antitoxin sampling, screening and cofolding.
#
#   generate -> Prodigal + QC -> profile-HMM -> AF3 monomer screen -> cofold
#
# Outputs (all in output_dir):
#   generated_sequences.csv      one row per proposal, accepted or rejected
#   filter_summary.csv           evaluated/rejected/passed per filter, in order
#   hmm_hits.csv                 every profile-HMM hit, per protein, with E-value
#   af3_fold_scores.csv          every monomer prediction, passing or not
#   proteins.csv/.fasta          proteins that cleared QC, the HMM and the screen
#   cofold_pairs.csv             every scored pair with its interface metrics
#   cofold_high_confidence.csv/.fasta   pairs that cleared the cofold gates
#   cofold_gated_with_novelty.csv       those pairs after the MMseqs2 filter
#   raw_metadata.json            every constraint's full metadata, all proposals
#   af3_monomers/, af3_complexes/       persisted AlphaFold 3 result folders
#
# Cofolding runs as part of this script; set run_cofold: false to stop after
# the monomer screen.

# --- inputs / outputs -------------------------------------------------------
input_prompts: ./proto_pipelines/data/prompts/t2ta_sample_prompts.csv
output_dir: t2ta_sample

# --- generation -------------------------------------------------------------
# Generator family and checkpoint. 'evo2' is the default; the paper used
# Evo 1.5, so reproducing its numbers needs BOTH lines switched to:
#   generator: evo1
#   model_name: evo-1.5-8k-base
generator: evo2
model_name: evo2_7b        # evo2_7b | evo2_40b | evo2_7b_base | evo2_1b_base | ...

# Sample from a CUSTOM Evo 2 checkpoint (fine-tuned, watermarked, ablated)
# instead of the HuggingFace download. Point it at the weights DIRECTORY, not
# a checkpoint file. `model_name` above still selects the architecture the
# weights load into, so it must name the variant the checkpoint derives from.
# Evo 2 only -- Evo 1 has no such hook and setting both raises rather than
# silently sampling the stock model. Empty means "use the released weights".
model_local_path: ""
n_tokens: 2000                # new tokens per sample
temperature: 0.8
top_k: 4
batch_size: 10                # sequences per Evo GPU batch
n_sample_per_prompt: 10
seed: null                    # set an int for a reproducible run
device: cuda
verbose: false

# --- protein QC (reproduces filter_protein_fasta exactly) -------------------
filter_min_length: 50
filter_max_length: 300
filter_partial_bool: true     # require Prodigal partial=00
segmasker_threshold: 0.1      # max fraction of low-complexity residues

# --- AlphaFold 3 monomer screen ---------------------------------------------
# BASAL GATE, calibrated against real junk. Keeps 92% of Evo ORFs while
# dropping 46% of spurious ones.
#
# Measured on 24 Evo ORFs vs 24 ORFs called on random DNA, GC- and
# length-matched (both median 156 aa, balance p=0.85):
#   pTM   AUROC 0.854 [0.742-0.946]   <- the better discriminator
#   pLDDT AUROC 0.731 [0.580-0.865]
#
# Why these values and not stricter: pLDDT>=40/pTM>=0.25 drops 83% of junk but
# keeps only 58% of real ORFs; pLDDT>=45/pTM>=0.30 drops 92% but keeps 38%.
# The monomer fold is cheap and the cofold is expensive, but the cofold gate
# already rejects ~1/3 of confirmed-functional pairs, so losses here compound.
# This setting is deliberately high-sensitivity.
#
# Sanity check against knowns: all five validated designs pass comfortably
# (EvoAT1 67.7/0.46 ... EvoAT4 54.2/0.35), as do the natural E. coli toxins
# MazF (38.9/0.35) and YoeB (41.5/0.31) whose pairs rescued experimentally.
#
# What this gate is NOT doing: judging fold specificity. AlphaFold 3 cannot
# separate an Evo design from a composition-matched scramble of itself
# (pLDDT AUROC 0.475 - chance).
# It separates real ORFs from random-DNA ORFs because their composition
# differs, not because it recognises a specific fold. Treat it as a
# protein-likeness floor, not a quality score.
run_af3: true
af3_plddt_threshold: 30.0    # 0-100, single-sequence
af3_ptm_threshold: 0.20      # 0-1; the load-bearing one

af3_max_proteins_per_proposal: 8   # fold at most N ORFs per generation (0 = all)
af3_use_msa: false            # single-sequence: this is a triage step over many ORFs
af3_num_recycles: 10
af3_num_diffusion_samples: 5
af3_seeds: [0]
af3_save_structures: true

# --- profile-HMM filter (post ORF-calling + QC, pre-fold) -------------------
# ON BY DEFAULT. Keeps generations that produced at least one protein
# resembling a known type II TA family, so the expensive fold is spent on
# plausible candidates.
#
# The family list is DERIVED, not curated: 219 Pfam families hit at E<1e-2 by
# 767 known type II TA proteins (363 natural toxins + 395 natural antitoxins
# from TADB's experimentally validated type II loci, + 9 characterised
# designs). Prevalence >=1, synthetic hits retained.
#
# Why derived: all four validated EvoAT antitoxins have DUF6290 - a domain of
# unknown function - as their top Pfam hit and hit no canonical antitoxin
# family, so a name-curated list would discard them. DUF6290 is itself hit by
# 17 natural type II antitoxins, so it is a real family and not an artifact
# of including the designs.
#
# Validated: all knowns detected; 0 false positives on 30 non-TA proteins and
# random-DNA ORFs, and 0 on 30 composition-matched shuffles. All 13 canonical
# type II classes represented (RelBE, ParDE, MazEF, VapBC, HigBA, YefM-YoeB,
# YafQ-DinJ, Phd-Doc, GNAT/TacT, HicAB, MqsRA, CcdAB, Zeta-Epsilon) across 72
# genera. ~0.35 s/protein vs ~11 s against full Pfam.
#
# E<1.0 at scan time is deliberately lenient: the list itself supplies the
# specificity, and a strict E selects against the divergent sequences this
# pipeline exists to find. Rebuild at a different cutoff with
# a Pfam scan over known type II TA proteins.
#
# Caveat: 25 HTH families are included. 32 natural antitoxins are detected
# ONLY via those, so they carry real sensitivity, but a lone HTH hit is weak
# evidence - generic transcriptional regulators can pass on it.
hmm_path: ./proto_pipelines/data/models/ta_families.hmm
hmm_evalue_threshold: 1.0
hmm_required_profiles: []
hmm_min_matching_proteins: 1
hmm_annotate_only: false
# Only ONE protein in a generation needs a hit: a Type II locus yields a
# toxin and an antitoxin, either may carry the recognisable domain, and the
# partner is often the divergent one. The gate is on the generation, so every
# QC-surviving protein stays available for pairing and cofolding regardless
# of which one matched.

# --- pairing ----------------------------------------------------------------
# A Type II TA pair is two DIFFERENT proteins. Near-identical members are
# usually one gene called twice, a tandem duplication, or the same ORF on
# both strands -- cofolding those spends the expensive step on a homodimer
# that was never a TA hypothesis.
#
# Identity is MAFFT (align_method=auto) over columns where NEITHER sequence
# is gapped -- the same definition the paper's align_pair used. This is a
# different quantity from the MMseqs2 `pident` the novelty filter reports;
# the two are not directly comparable despite both being "percent identity".
# Set to 100.0 to disable.
max_pair_identity: 70.0
mafft_threads: 4

# --- cofolding (runs inside the same Program, as the last filter) -----------
# The cofold is a proto Constraint now, not a separate script: the optimizer
# short-circuits, so only generations that already yielded two confident
# proteins are ever cofolded, and the pairs plus their interface scores live
# on the proposal metadata rather than in an intermediate CSV.
run_cofold: true

# Gates. All three must pass for a pair to count. Calibrated on 80 natural TA
# pairs and checked against 10 functionally labelled de novo pairs -- see
# "Calibration results" in proto_pipelines/README.md.
cofold_pdockq2_threshold: 0.23   # DockQ "Acceptable" class boundary
cofold_min_iptm: 0.55            # mid-gap in the de novo positives
cofold_min_avg_plddt: 80.0       # non-binding guard at this value
cofold_min_passing_pairs: 1      # pairs that must clear the gates to keep a generation

# Pair count grows quadratically in proteins per generation and each fold is
# minutes, so this cap is the main lever on GPU cost. 0 = no cap.
cofold_max_pairs_per_proposal: 6

# MSA on: this is the scoring step, and the interface estimate depends on it.
cofold_af3_use_msa: true
cofold_af3_num_recycles: 10
cofold_af3_num_diffusion_samples: 5
cofold_af3_save_structures: true

# Optional: also fold every candidate against fixed targets, asking "does any
# generated protein bind THIS one?" rather than "did Evo make a matched pair?"
# cofold_target_fasta: ./targets/known_toxins.fasta

# --- novelty (post-gate provenance policy, not evidence of function) --------
# MMseqs2 `pident` against a reference set -- a different measure from the
# MAFFT identity used for max_pair_identity above; the two are not comparable.
# novelty_mmseqs_db: /path/to/known_proteins.fasta
novelty_max_identity: 75.0
